name: FQ APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q FQViewer.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK
        working-directory: FQViewer
        run: gradle assembleDebug --no-daemon --stacktrace
      - run: cp FQViewer/app/build/outputs/apk/debug/app-debug.apk FQ-Viewer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FQ-Viewer
          path: FQ-Viewer.apk
